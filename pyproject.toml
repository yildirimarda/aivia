[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aivia"
version = "0.1.0"
description = "Configurable AI-backed image, video, audio and music generation assistant"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
aivia = "aivia.cli:main"

[dependency-groups]
dev = [
    "build>=1.2",
    "hatchling>=1.27",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aivia"]
artifacts = [
  "src/aivia/assets/fonts/**",
  "src/aivia/data/defaults/**",
]
