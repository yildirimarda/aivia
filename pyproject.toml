[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aivia"
version = "0.1.0"
description = "Configurable AI-backed image, video, audio and music generation assistant"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
aivia = "aivia.cli:main"

[dependency-groups]
dev = [
    "build>=1.2",
    "hatchling>=1.27",
    "mypy>=2.4.0",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aivia"]
artifacts = [
  "src/aivia/assets/fonts/**",
  "src/aivia/data/defaults/**",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]
extend-exclude = ["build", "dist", "graphify-out", "logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["aivia"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
show_error_codes = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "live: requires --live, network access and a configured live budget",
  "slow: long-running; excluded from the fast offline run",
  "golden: compares against pinned golden artifacts on the pinned Linux image",
]
