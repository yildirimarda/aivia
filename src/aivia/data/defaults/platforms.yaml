# Publishing limits per platform. This file is data: update it instead of
# releasing new code when a platform changes a limit. Fractions in safe_area
# are measured from each edge of the canvas.

schema_version: 1

defaults:
  disclosure:
    required: true
    text: "This content was generated with AI."
    on_screen_label: "AI-generated"
    metadata: true

platforms:
  youtube:
    name: YouTube Shorts
    media_types: [video]
    limits:
      video:
        min_duration_seconds: 1
        max_duration_seconds: 180
        resolutions: ["1080x1920"]
        aspect_ratios: ["9:16"]
        max_file_size_bytes: 268435456000
        audio_required: true
        loudness_lufs: -14
    caption_limits:
      max_length: 5000
      max_title_length: 100
      max_description_length: 5000
      max_hashtags: 15
    safe_area:
      top: 0.10
      bottom: 0.20
      left: 0.06
      right: 0.06
    disclosure:
      metadata_field: containsSyntheticMedia

  instagram:
    name: Instagram Reels
    media_types: [video, image, carousel]
    limits:
      video:
        min_duration_seconds: 3
        max_duration_seconds: 900
        resolutions: ["1080x1920"]
        aspect_ratios: ["9:16"]
        max_file_size_bytes: 1073741824
        audio_required: true
        loudness_lufs: -14
      image:
        resolutions: ["1080x1080", "1080x1350"]
        aspect_ratios: ["1:1", "4:5"]
        max_file_size_bytes: 8388608
      carousel:
        max_file_size_bytes: 8388608
    caption_limits:
      max_length: 2200
      max_description_length: 2200
      max_hashtags: 30
    safe_area:
      top: 0.14
      bottom: 0.20
      left: 0.06
      right: 0.06

  tiktok:
    name: TikTok
    media_types: [video]
    limits:
      video:
        min_duration_seconds: 3
        max_duration_seconds: 600
        resolutions: ["1080x1920"]
        aspect_ratios: ["9:16"]
        max_file_size_bytes: 4294967296
        audio_required: true
        loudness_lufs: -14
    caption_limits:
      max_length: 2200
      max_description_length: 2200
      max_hashtags: 20
    safe_area:
      top: 0.10
      bottom: 0.25
      left: 0.06
      right: 0.06

  x:
    name: X
    media_types: [video, image]
    limits:
      video:
        min_duration_seconds: 1
        max_duration_seconds: 140
        resolutions: ["1280x720", "720x1280", "1080x1080"]
        aspect_ratios: ["16:9", "9:16", "1:1"]
        max_file_size_bytes: 536870912
        loudness_lufs: -14
      image:
        resolutions: ["1200x675", "1080x1080"]
        aspect_ratios: ["16:9", "1:1"]
        max_file_size_bytes: 5242880
    caption_limits:
      max_length: 280
      max_description_length: 280
      max_hashtags: 10
    disclosure:
      required: true

  telegram:
    name: Telegram channel
    media_types: [video, image, audio, web_card]
    limits:
      video:
        min_duration_seconds: 1
        max_duration_seconds: 3600
        resolutions: ["1920x1080", "1080x1920"]
        aspect_ratios: ["16:9", "9:16", "1:1"]
        max_file_size_bytes: 2147483648
        loudness_lufs: -14
      image:
        max_file_size_bytes: 10485760
      audio:
        max_duration_seconds: 3600
        max_file_size_bytes: 52428800
        loudness_lufs: -14
      web_card:
        max_file_size_bytes: 5242880
    caption_limits:
      max_length: 1024
      max_description_length: 1024
      max_hashtags: 20
    disclosure:
      required: false
      metadata: false
