# Copied to $XDG_CONFIG_HOME/aivia/config.yaml on first run.
schema_version: 1

languages:
  default: en
  en:
    name: English
    locale: en_US
    words_per_second:
      min: 2.0
      max: 3.5
    subtitle_font: Lato
    hashtag_style: lower
  de:
    name: German
    locale: de_DE
    words_per_second:
      min: 2.0
      max: 3.5
    subtitle_font: Lato
    hashtag_style: title
  tr:
    name: Turkish
    locale: tr_TR
    words_per_second:
      min: 2.0
      max: 3.5
    subtitle_font: Lato
    hashtag_style: lower

pipeline:
  stages: [research, write, voice, visuals, render, review, publish]
  timezone: Europe/Berlin

formats:
  narrated_still:
    description: One or a few images with narration and word-synced subtitles.
    stages:
      - stage: input_topic
      - stage: write
      - stage: voice
      - stage: visuals
        options:
          strategy: image
      - stage: render
    capabilities: [llm, tts, image_gen]
    output_type: video
    handler: save
  quote_card:
    description: Typography-led still image.
    stages:
      - stage: input_topic
      - stage: write
        options:
          mode: quote
      - stage: render
    capabilities: [llm, image_gen]
    output_type: image
    handler: save
  song_video:
    description: Song with lyrics, karaoke subtitles and visual backgrounds.
    stages:
      - stage: input_topic
      - stage: write
        options:
          mode: lyrics
      - stage: music
      - stage: align
      - stage: visuals
      - stage: render
    capabilities: [llm, music_gen, tts, image_gen]
    output_type: video
    handler: publish
  character_short:
    description: Short video built around a consistent character.
    stages:
      - stage: input_topic
      - stage: write
      - stage: voice
      - stage: visuals
        options:
          character_consistency: true
      - stage: render
    capabilities: [llm, tts, video_gen]
    output_type: video
    handler: publish
  personalized_song_card:
    description: Personalized song card delivered to an order recipient.
    stages:
      - stage: input_topic
      - stage: write
        options:
          mode: lyrics
      - stage: music
      - stage: render
    capabilities: [llm, music_gen]
    output_type: audio
    handler: deliver

video:
  resolution: 1080x1920
  fps: 30
  duration_seconds:
    min: 20
    max: 45
  loudness_lufs: -14

render:
  fonts_dir: package
  require_bundled_fonts: true
  default_font: Lato
  fallback_fonts: [Lato]
  font_size: 48
  min_contrast: 4.5
  contrast_strategy: outline

budget:
  per_video: 0
  per_day: 0
  per_month: 0
  per_order: 0
  per_instruction: 0
  per_run: 0
  per_call: 0
  confirm_above: 0
  per_provider: {}
  alerts: []
  on_exceed: pause

llm:
  chain: []
  roles: {}
  pricing: {}
  max_repairs: 2

embeddings:
  chain: []
  dimensions: null
  batch_size: 64
  cache_size: 10000
  pricing: {}

prompts:
  versions: {}

models_file:
  path: models.yaml

providers: {}

circuit:
  failure_threshold: 5
  cooldown_seconds: 60.0

ratelimit:
  requests_per_minute: 60
  burst: 0
  on_limit: wait

reconcile:
  drift_threshold: 0.1
  absolute_threshold_usd: 0.0

http:
  timeout_seconds: 30.0
  connect_timeout_seconds: null
  read_timeout_seconds: null
  write_timeout_seconds: null
  pool_timeout_seconds: null
  max_attempts: 3
  backoff_base_seconds: 0.5
  backoff_max_seconds: 30.0
  jitter_ratio: 0.5
  retry_statuses: [408, 425, 429, 500, 502, 503, 504]
  respect_retry_after: true
  follow_redirects: true

quality:
  enabled: true
  min_score: 0.7
  max_retries: 2
  sample_frames: 3
  vision: true
  weights:
    prompt_adherence: 0.4
    technical_quality: 0.3
    aesthetic_quality: 0.3

scoring:
  rubric_version: "1"
  min_score: 0.6
  min_dimension_score: 0.0
  weights:
    relevance: 0.35
    originality: 0.25
    accuracy: 0.25
    engagement: 0.15

storage:
  backend: local
  local_dir: media
  prefix: ""
  presign_seconds: 3600
  use_path_style: true

database:
  filename: aivia.db
  busy_timeout_ms: 5000

api:
  host: 127.0.0.1
  port: 8765
  require_auth: true
  api_key_ref: AIVA_API_KEY
  max_body_bytes: 10000000
  rate_limit_per_minute: 60

jobs:
  concurrency: 1
  max_parallel_runs: 1
  max_attempts: 3
  heartbeat_seconds: 30
  poll_seconds: 2
  stale_after_seconds: 120
  retry_delay_seconds: 1
  backoff_multiplier: 2
  max_retry_delay_seconds: 300
  max_queue_depth: 0

safety:
  enabled: true
  screen_prompts: true
  screen_media: true
  block_categories: []
  allow_regenerate: true

platforms:
  accounts: {}

schedule:
  enabled: true
  default: ""
  timezone: UTC
  schedules: {}

publish:
  enabled: true
  dry_run: true
  default_profile: ""
  accounts: {}

presets:
  presets: {}

retention:
  intermediates_days: 7
  cache_days: 14
  logs_days: 30
  personal_data_days: 30
  orders_days: 90
  deliveries_days: 30
  web_card_hits_days: 30
  delete_final_outputs: false

review:
  enabled: true
  approval_mode: ask
  timeout_seconds: 86400
  on_timeout: reject
  allow_regenerate: true
  max_regenerations: 3
  preview: true
  notify: true

privacy:
  redact_logs: true
  redact_prompts: false
  store_prompt_text: true
  allow_personal_data: false
  placeholder_mode: false
  data_processing_record: true

tracing:
  enabled: false
  exporter: none
  service_name: aivia
  sample_ratio: 1.0

accessibility:
  enabled: true
  alt_text: true
  subtitles: true
  min_contrast: 4.5
  subtitle_font: Lato
  subtitle_font_size: 32
  subtitle_outline: true
  subtitle_background: false

profiles:
  default:
    format: narrated_still
    topic_modes:
      niche: 0.7
      keywords: 0.3
    brief: Short, factual explainers with a calm and curious tone.
    niche: general knowledge
    keywords: [history, science]
    examples:
      liked: []
      disliked: []
    sources: [wikipedia]
    tone: calm and factual
    style_bible: default
    character: null
    brand_kit: null
    accounts: []
    overrides: {}

planner:
  enabled: true
  max_steps: 10
  max_iterations: 3
  approval_mode: ask
  allowed_tools: []
  preview: true
  defaults:
    format: narrated_still
    language: en
  budget:
    per_instruction: 0

reference:
  enabled: true
  similarity_level: medium
  visual_threshold: 0.9
  text_threshold: 0.85
  max_regenerations: 2
  download_policy:
    mode: allow
    max_bytes: 52428800
    timeout_seconds: 30
    allowed_hosts: []
    follow_redirects: true
    max_redirects: 5
    cache: true

character:
  enabled: true
  consistency_strategies: [composite, reference, adapter, prompt_only]
  qa:
    min_score: 0.8
    vision_threshold: 0.8
    embedding_threshold: 0.75
    max_retries: 2
  consent:
    voice_cloning: false
    real_person_likeness: false
    resemblance_warning: true
    require_ownership: true
  max_reference_images: 4

brand:
  name: default
  colors: []
  fonts: []
  logo: ""
  watermark: ""
  intro: ""
  outro: ""
  caption_style: ""

occasions:
  default: birthday
  occasions:
    birthday:
      label: Birthday
      description: A personal birthday song card.
      variables:
        name:
          type: text
          required: true
          max_length: 60
        age:
          type: integer
          required: false
        message:
          type: text
          required: false
          max_length: 500
      personalization_levels: [basic, standard, premium]
      formats: [personalized_song_card]
      files: []

orders:
  default_level: standard
  personalization_levels:
    basic:
      description: Name overlay on a still background.
      stages: [name_overlay]
      outputs: [png]
      price: 0.0
      include_age: false
      include_interests: false
    standard:
      description: Personalized song with a still background.
      stages: [write, music, name_overlay, render]
      outputs: [mp4, mp3]
      price: 19.0
      include_age: true
      include_interests: false
    premium:
      description: Personalized song with an animated background and voice.
      stages: [write, music, voice, visuals, name_overlay, render]
      outputs: [mp4, gif, webp, mp3, png, web_card]
      price: 39.0
      include_age: true
      include_interests: true
  name_verify:
    enabled: true
    retries: 3
    threshold: 0.8
  pricing:
    currency: USD
    amount: 19.0
    tax_rate: 0.0
    tax_included: false
  timezone: Europe/Berlin
  max_batch_size: 100
  max_name_length: 80
  max_message_length: 1000

delivery:
  enabled: true
  default: folder
  chain: [folder, link, email, webhook]
  providers:
    folder:
      type: folder
      enabled: true
      path: deliveries
    link:
      type: link
      enabled: false
      expires_seconds: 604800
    email:
      type: email
      enabled: false
      subject: Your personalized card
    webhook:
      type: webhook
      enabled: false
      url: ""
      secret_ref: AIVA_WEBHOOK_SECRET
      allowlist: []
  retry_seconds: 60
  max_attempts: 3
  notify_on_failure: true
