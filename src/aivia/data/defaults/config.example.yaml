# Copied to $XDG_CONFIG_HOME/aivia/config.yaml on first run.
schema_version: 1

languages:
  default: en
  en:
    name: English
    locale: en_US
    words_per_second:
      min: 2.0
      max: 3.5
    subtitle_font: Lato
    hashtag_style: lower
  de:
    name: German
    locale: de_DE
    words_per_second:
      min: 2.0
      max: 3.5
    subtitle_font: Lato
    hashtag_style: title
  tr:
    name: Turkish
    locale: tr_TR
    words_per_second:
      min: 2.0
      max: 3.5
    subtitle_font: Lato
    hashtag_style: lower

pipeline:
  stages: [research, write, voice, visuals, render, review, publish]
  timezone: Europe/Berlin

formats:
  narrated_still:
    description: One or a few images with narration and word-synced subtitles.
    stages:
      - stage: input_topic
      - stage: write
      - stage: voice
      - stage: visuals
        options:
          strategy: image
      - stage: render
    capabilities: [llm, tts, image_gen]
    output_type: video
    handler: save
  quote_card:
    description: Typography-led still image.
    stages:
      - stage: input_topic
      - stage: write
        options:
          mode: quote
      - stage: render
    capabilities: [llm, image_gen]
    output_type: image
    handler: save
  song_video:
    description: Song with lyrics, karaoke subtitles and visual backgrounds.
    stages:
      - stage: input_topic
      - stage: write
        options:
          mode: lyrics
      - stage: music
      - stage: align
      - stage: visuals
      - stage: render
    capabilities: [llm, music_gen, tts, image_gen]
    output_type: video
    handler: publish
  character_short:
    description: Short video built around a consistent character.
    stages:
      - stage: input_topic
      - stage: write
      - stage: voice
      - stage: visuals
        options:
          character_consistency: true
      - stage: render
    capabilities: [llm, tts, video_gen]
    output_type: video
    handler: publish
  personalized_song_card:
    description: Personalized song card delivered to an order recipient.
    stages:
      - stage: input_topic
      - stage: write
        options:
          mode: lyrics
      - stage: music
      - stage: render
    capabilities: [llm, music_gen]
    output_type: audio
    handler: deliver

video:
  resolution: 1080x1920
  fps: 30
  duration_seconds:
    min: 20
    max: 45
  loudness_lufs: -14

render:
  fonts_dir: package
  require_bundled_fonts: true
  default_font: Lato
  fallback_fonts: [Lato]
  font_size: 48
  min_contrast: 4.5
  contrast_strategy: outline

budget:
  per_video: 0
  per_day: 0
  per_month: 0
  per_order: 0
  per_instruction: 0
  per_run: 0
  per_call: 0
  per_provider: {}
  alerts: []
  on_exceed: pause

llm:
  chain: []
  roles: {}
  pricing: {}
  max_repairs: 2

quality:
  enabled: true
  min_score: 0.7
  max_retries: 2
  sample_frames: 3
  vision: true
  weights:
    prompt_adherence: 0.4
    technical_quality: 0.3
    aesthetic_quality: 0.3

scoring:
  rubric_version: "1"
  min_score: 0.6
  min_dimension_score: 0.0
  weights:
    relevance: 0.35
    originality: 0.25
    accuracy: 0.25
    engagement: 0.15

storage:
  backend: local
  local_dir: media
  prefix: ""
  presign_seconds: 3600
  use_path_style: true

api:
  host: 127.0.0.1
  port: 8765
  require_auth: true
  api_key_ref: AIVA_API_KEY
  max_body_bytes: 10000000
  rate_limit_per_minute: 60

jobs:
  concurrency: 1
  max_attempts: 3
  heartbeat_seconds: 30
  poll_seconds: 2
  stale_after_seconds: 120
  max_queue_depth: 0

safety:
  enabled: true
  screen_prompts: true
  screen_media: true
  block_categories: []
  allow_regenerate: true

platforms:
  accounts: {}

presets:
  presets: {}

retention:
  intermediates_days: 7
  cache_days: 14
  logs_days: 30
  personal_data_days: 30
  orders_days: 90
  deliveries_days: 30
  web_card_hits_days: 30
  delete_final_outputs: false

review:
  enabled: true
  approval_mode: ask
  timeout_seconds: 86400
  on_timeout: reject
  allow_regenerate: true
  max_regenerations: 3
  preview: true
  notify: true

privacy:
  redact_logs: true
  redact_prompts: false
  store_prompt_text: true
  allow_personal_data: false
  placeholder_mode: false
  data_processing_record: true

tracing:
  enabled: false
  exporter: none
  service_name: aivia
  sample_ratio: 1.0

accessibility:
  enabled: true
  alt_text: true
  subtitles: true
  min_contrast: 4.5
  subtitle_font: Lato
  subtitle_font_size: 32
  subtitle_outline: true
  subtitle_background: false
