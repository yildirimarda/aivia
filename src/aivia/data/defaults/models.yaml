  mock-video:
    capabilities: [video_gen]
  mock-music:
    capabilities: [music_gen]
  mock-sfx:
    capabilities: [sfx]
  mock-tts:
    capabilities: [tts]
  mock-stt:
    capabilities: [stt]
  mock-lipsync:
    capabilities: [lipsync]
