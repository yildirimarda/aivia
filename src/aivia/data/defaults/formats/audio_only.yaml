description: Audio track with generated cover art and embedded metadata.
stages:
  - stage: input_topic
  - stage: write
    options:
      mode: lyrics
  - stage: music
    options:
      lyrics_from_script: true
  - stage: cover
    options:
      aspect_ratio: "1:1"
  - stage: render
    options:
      output_format: mp3
      embed_cover_art: true
capabilities: [llm, music_gen, image_gen]
output_type: audio
handler: save
