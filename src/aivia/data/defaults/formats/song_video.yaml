description: Song with lyrics, karaoke subtitles and visual backgrounds.
stages:
  - stage: input_topic
  - stage: write
    options:
      mode: lyrics
  - stage: music
    options:
      lyrics_from_script: true
  - stage: align
  - stage: visuals
    options:
      strategy: image
  - stage: render
capabilities: [llm, music_gen, stt, image_gen]
output_type: video
handler: publish
